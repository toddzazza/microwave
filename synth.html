          </div>



          <!-- RENTAL ACTION -->

<div class="rental-action">

  ></div>

  <div class="rental-price-options">

    <button
      type="button"

      <strong id="synth-price-day">—</strong>
    </button>

    <button
      type="button"
      class="rental-price-option"
      data-period="weekend"
    >
      <span>WEEKEND</span>
      <strong id="synth-price-weekend">—</strong>
    </button>

    <button
      type="button"
      class="rental-price-option"
      data-period="week"
    >
      <span>WEEK</span>
      <strong id="synth-price-week">—</strong>
    </button>

  </div>

  <div
    class="rental-includes"
    id="synth-includes"
  ></div>

  <button
    type="button"
    id="synth-add-button"
    class="add-rental-button equipment-add-button"
  >
    ADD TO CART
  </button>

</div>


        </div>

      </div>



      <!-- ABOUT -->

      <div class="bar equipment-description-bar">

      </div>

    </main>

},



      /* ---------------------------------

      ---------------------------------- */

     td3: {

  name:
    "Behringer TD-3",

  status:
    "Available",

        prices: {
          day: 150,

        },

  strengths: [

    },

  ],

  reference:

  description:

},

        },

      },



      /* ---------------------------------
         ROLAND JU-06A
      ---------------------------------- */

      ju06a: {

        name:
          "Roland JU-06A",

        type:
          "Virtual analog synthesizer",

        status:
          "Available",

        prices: {
          day: 200,
          weekend: 350,
          week: 550
        },

        image:

        description:
          "Roland Boutique synthesizer combining characteristics of the classic Juno-60 and Juno-106."

      },



      /* ---------------------------------
         ROLAND JX-03
      ---------------------------------- */

      jx03: {

        name:
          "Roland JX-03",

        type:
          "Virtual analog synthesizer",

        status:
          "Available",

        prices: {
          day: 200,
          weekend: 350,
          week: 550
        },

        image:
          "images/synth/jx03.jpg",

        description:
          "Roland Boutique synthesizer inspired by the JX-3P."

      },



      /* ---------------------------------
         ROLAND MKS-50
      ---------------------------------- */

      mks50: {

        name:
          "Roland MKS-50",

        type:
          "Analog rack synthesizer",

        status:
          "Available",

        prices: {
          day: 450,
          weekend: 750,
          week: 1200
        },

        rentalIncludes:
          "Includes Roland PG-300 programmer",

        image:
          "images/synth/mks50.jpg",

        description:
          "Six-voice analog rackmount synthesizer from Roland."

      },



      /* ---------------------------------
         ROLAND SH-01A
      ---------------------------------- */

      sh01a: {

        name:
          "Roland SH-01A",

        type:
          "Virtual analog synthesizer",

        status:
          "Available",

        prices: {
          day: 250,
          weekend: 400,
          week: 600
        },

        image:
          "images/synth/sh01a.jpg",

        description:
          "Roland Boutique synthesizer inspired by the classic SH-101."

      }

    };



    /* ---------------------------------
       READ SYNTH FROM URL
    ---------------------------------- */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const synthID =
      params.get("id");


    const synth =
      synths[synthID];



    /* ---------------------------------
       SYNTH FOUND
    ---------------------------------- */

    if (synth) {


      /* PAGE TITLE */

      document.title =
        synth.name + " — Microwave";


      document
        .getElementById("synth-title")
        .textContent =
        synth.name;



      /* IMAGE */

      document
        .getElementById("synth-image")
        .src =
        synth.image;


      document
        .getElementById("synth-image")
        .alt =
        synth.name;



      /* CARD TYPE */

      document
        .getElementById("synth-type")
        .textContent =
        synth.type || "Synthesizer";



      /* TECHNICAL SPECS */

      document
        .getElementById("synth-polyphony")
        .textContent =
        synth.polyphony || "—";


      document
        .getElementById("synth-synthesis")
        .textContent =
        synth.synthesis || "—";


      document
        .getElementById("synth-oscillators")
        .textContent =
        synth.oscillators || "—";



      /* ---------------------------------
         STRONG SIDES
      ---------------------------------- */

      const strengthsContainer =
        document.getElementById(
          "synth-strengths"
        );


      strengthsContainer.innerHTML = "";


      if (
        synth.strengths &&
        synth.strengths.length > 0
      ) {

        synth.strengths.forEach(
          function (strength) {


            /* ROW */

            const row =
              document.createElement("div");

            row.className =
              "synth-strength";


            /* NAME */

            const name =
              document.createElement("span");

            name.className =
              "synth-strength-name";

            name.textContent =
              strength.name;


            /* METER */

            const meter =
              document.createElement("span");

            meter.className =
              "synth-strength-meter";


            for (
              let i = 1;
              i <= 10;
              i++
            ) {

              const block =
                document.createElement("span");

              block.className =
                "synth-strength-block";


              if (
                i <= strength.score
              ) {

                block.classList.add(
                  "filled"
                );

              }


              meter.appendChild(
                block
              );

            }


            /* SCORE */

            const score =
              document.createElement("span");

            score.className =
              "synth-strength-score";

            score.textContent =
              strength.score;


            /* BUILD ROW */

            row.appendChild(
              name
            );

            row.appendChild(
              meter
            );

            row.appendChild(
              score
            );


            strengthsContainer
              .appendChild(
                row
              );

          }
        );

      }

      else {

        strengthsContainer.textContent =
          "—";

      }



      /* ---------------------------------
         SOUND REFERENCE
      ---------------------------------- */

      document
        .getElementById(
          "synth-reference"
        )
        .textContent =
        synth.reference || "—";


      document
        .getElementById(
          "synth-reference-part"
        )
        .textContent =
        synth.referencePart || "";



      /* ABOUT */

      document
        .getElementById(
          "synth-description"
        )
        .textContent =
        synth.description || "";



      /* ---------------------------------
         RENTAL STATUS
      ---------------------------------- */

      const statusElement =
        document.getElementById(
          "synth-status"
        );


      statusElement.textContent =
        synth.status === "Available"
          ? "AVAILABLE FOR RENT"
          : synth.status.toUpperCase();


      /* ---------------------------------
         RENTAL PRICES
      ---------------------------------- */

      function formatPrice(value) {
        return value.toLocaleString("da-DK") + " DKK";
      }


      document
        .getElementById("synth-price-day")
        .textContent =
        synth.prices
          ? formatPrice(synth.prices.day)
          : "—";


      document
        .getElementById("synth-price-weekend")
        .textContent =
        synth.prices
          ? formatPrice(synth.prices.weekend)
          : "—";


      document
        .getElementById("synth-price-week")
        .textContent =
        synth.prices
          ? formatPrice(synth.prices.week)
          : "—";


      const rentalIncludesElement =
        document.getElementById(
          "synth-rental-includes"
        );


      rentalIncludesElement.textContent =
        synth.rentalIncludes || "";


      rentalIncludesElement.style.display =
        synth.rentalIncludes
          ? "block"
          : "none";

/* ---------------------------------
   RENTAL PERIOD
---------------------------------- */

const priceButtons =
  document.querySelectorAll(
    ".rental-price-option"
  );

let selectedPeriod = "";
let selectedPrice = "";

priceButtons.forEach(function (button) {

  button.addEventListener("click", function () {

    priceButtons.forEach(function (otherButton) {
      otherButton.classList.remove("selected");
    });

    button.classList.add("selected");

    selectedPeriod =
      button.dataset.period;

    selectedPrice =
      button.dataset.price;

    addButton.dataset.period =
      selectedPeriod;

    addButton.dataset.price =
      selectedPrice;

  });

});

      /* ---------------------------------
         ADD TO CART
      ---------------------------------- */

      const addButton =
        document.getElementById(
          "synth-add-button"
        );


      addButton.dataset.id =
        synthID;


      addButton.dataset.name =
        synth.name;



      /* COMING SOON */

      if (
        synth.status !== "Available"
      ) {

        addButton.disabled =
          true;

        addButton.textContent =
          "NOT YET AVAILABLE";

      }

    }



    /* ---------------------------------
       SYNTH NOT FOUND
    ---------------------------------- */

    else {


      document
        .getElementById(
          "synth-title"
        )
        .textContent =
        "Synthesizer not found";


      document
        .getElementById(
          "synth-image"
        )
        .style.display =
        "none";


      document
        .querySelector(
          ".synth-card"
        )
        .style.display =
        "none";


      document
        .querySelector(
          ".rental-action"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "synth-description"
        )
        .textContent =
        "This synthesizer could not be found in the Microwave catalogue.";

    }

  </script>
