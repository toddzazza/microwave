<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Synthesizer — Microwave</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="site">

    <header>

      <div id="branding">
        <h1>Microwave</h1>

        <div class="tagline">
          SYNTHESIZER RENTAL / SALES / COPENHAGEN
        </div>
      </div>

      <nav>
        <a href="index.html">Home</a>
        <a class="active" href="rent.html">Rent</a>
        <a href="sale.html">For Sale</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="rental-cart.html" class="cart-nav">
  CART [<span class="rental-cart-count">0</span>]
</a>
      </nav>

    </header>


    <main>

      <p>
        <a href="rent_synthesizers.html">← Back to Synthesizers</a>
      </p>


      <div class="section-title" id="synth-title">
        Synthesizer
      </div>


      <div class="equipment-page">

        <div class="equipment-photo">

          <img
            id="synth-image"
            src=""
            alt=""
          >

        </div>


        <div class="equipment-info">

          <h2 id="synth-name"></h2>

          <p class="equipment-type" id="synth-type"></p>


          <div class="bar">
            Rental Information
          </div>


          <table class="spec-table">

            <tr>
              <td>Status</td>
              <td id="synth-status"></td>
            </tr>

            <tr>
              <td>Manufacturer</td>
              <td id="synth-manufacturer"></td>
            </tr>

            <tr>
              <td>Type</td>
              <td id="synth-type-table"></td>
            </tr>

            <tr>
              <td>Location</td>
              <td>Copenhagen</td>
            </tr>

          </table>


          <div class="equipment-contact">

  <button
    type="button"
    id="synth-add-button"
    class="add-rental-button"
  >
    ADD TO CART
  </button>

</div>

        </div>

      </div>


      <div class="bar equipment-description-bar">
        About
      </div>

      <div class="equipment-description">

        <p id="synth-description"></p>

      </div>

    </main>


    <footer>
  MICROWAVE / COPENHAGEN / DENMARK
  <br>
  BLU VENUS / CVR 46189566
  <br>
  Last updated: September 2026
</footer>

  </div>


  <div class="fire-bottom"></div>


  <script>

    const synths = {

      monopoly: {
        name: "Behringer MonoPoly",
        manufacturer: "Behringer",
        type: "Analog synthesizer",
        status: "Available",
        image: "images/synth/monopoly.jpg",
        description: "Four-voice analog synthesizer with flexible mono, unison and polyphonic operation."
      },

      pro800: {
        name: "Behringer Pro-800",
        manufacturer: "Behringer",
        type: "Analog polyphonic synthesizer",
        status: "Available",
        image: "images/synth/pro800.jpg",
        description: "Eight-voice analog polyphonic synthesizer with classic programmable architecture."
      },

      td3: {
        name: "Behringer TD-3",
        manufacturer: "Behringer",
        type: "Analog bass synthesizer",
        status: "Available",
        image: "images/synth/td3.jpg",
        description: "Analog bass-line synthesizer with built-in sequencer."
      },

      d550: {
        name: "Roland D-550",
        manufacturer: "Roland",
        type: "Digital rack synthesizer",
        status: "Available",
        image: "images/synth/d550.jpg",
        description: "Rackmount digital synthesizer using Roland's Linear Arithmetic synthesis architecture."
      },

      jd08: {
        name: "Roland JD-08",
        manufacturer: "Roland",
        type: "Digital synthesizer",
        status: "Available",
        image: "images/synth/jd08.jpg",
        description: "Compact digital synthesizer inspired by the Roland JD series."
      },

      jp08: {
        name: "Roland JP-08",
        manufacturer: "Roland",
        type: "Virtual analog synthesizer",
        status: "Available",
        image: "images/synth/jp08.jpg",
        description: "Compact Roland Boutique synthesizer inspired by the Jupiter-8."
      },

      jp8080: {
        name: "Roland JP-8080",
        manufacturer: "Roland",
        type: "Virtual analog synthesizer",
        status: "Available",
        image: "images/synth/jp8080.jpg",
        description: "Rack and desktop virtual analog synthesizer from Roland's JP series."
      },

      ju06a: {
        name: "Roland JU-06A",
        manufacturer: "Roland",
        type: "Virtual analog synthesizer",
        status: "Available",
        image: "images/synth/ju06a.jpg",
        description: "Roland Boutique synthesizer combining characteristics of the classic Juno-60 and Juno-106."
      },

      jx03: {
        name: "Roland JX-03",
        manufacturer: "Roland",
        type: "Virtual analog synthesizer",
        status: "Available",
        image: "images/synth/jx03.jpg",
        description: "Roland Boutique synthesizer inspired by the JX-3P."
      },

      mks50: {
        name: "Roland MKS-50",
        manufacturer: "Roland",
        type: "Analog rack synthesizer",
        status: "Available",
        image: "images/synth/mks50.jpg",
        description: "Six-voice analog rackmount synthesizer from Roland."
      },

      sh01a: {
        name: "Roland SH-01A",
        manufacturer: "Roland",
        type: "Virtual analog synthesizer",
        status: "Available",
        image: "images/synth/sh01a.jpg",
        description: "Roland Boutique synthesizer inspired by the classic SH-101."
      }

    };


    const params = new URLSearchParams(window.location.search);

    const synthID = params.get("id");

    const synth = synths[synthID];


    if (synth) {

      document.title = synth.name + " — Microwave";

      document.getElementById("synth-title").textContent =
        synth.name;

      document.getElementById("synth-name").textContent =
        synth.name;

      document.getElementById("synth-type").textContent =
        synth.type;

      document.getElementById("synth-image").src =
        synth.image;

      document.getElementById("synth-image").alt =
        synth.name;

      document.getElementById("synth-status").textContent =
        synth.status;

      document.getElementById("synth-manufacturer").textContent =
        synth.manufacturer;

      document.getElementById("synth-type-table").textContent =
        synth.type;

      document.getElementById("synth-description").textContent =
        synth.description;
      const addButton =
  document.getElementById("synth-add-button");

addButton.dataset.id = synthID;
addButton.dataset.name = synth.name;

    }

    else {

      document.getElementById("synth-title").textContent =
        "Synthesizer not found";

      document.getElementById("synth-name").textContent =
        "Equipment not found";

      document.getElementById("synth-image").style.display =
        "none";

      document.getElementById("synth-description").textContent =
        "This synthesizer could not be found in the Microwave catalogue.";
      document.getElementById("synth-add-button").style.display =
  "none";

    }

  </script>

<script src="rental-cart.js"></script>
</body>

</html>
